<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <header>
    <h1>My Product Gallery</h1>
  </header>
  <main>

    <div class="gallery">

      <div class="card">
        <div class="image-box">
          <img src="https://via.placeholder.com/250" alt="Product">
          <div class="overlay">Buy Now</div>
        </div>
        <h3>Smart Watch</h3>
        <p>Modern smart watch with fitness tracking.</p>
        <span class="tag">New</span>
      </div>

      <div class="card">
        <div class="image-box">
          <img src="https://via.placeholder.com/250" alt="Product">
          <div class="overlay">View Details</div>
        </div>
        
        <h3>Wireless Headphones</h3>
        <p>Noise cancellation and high quality sound.</p>
        <span class="tag sticky">Popular</span>
      </div>

      <div class="card">
        <div class="image-box">
          <img src="https://via.placeholder.com/250" alt="Product">
          <div class="overlay">Add to Cart</div>
        </div>
        <h3>Smart Phone</h3>
        <p>Latest smartphone with advanced features.</p>
      </div>
    </div>
  </main>
  <footer>
    © 2026 Product Gallery | All Rights Reserved
  </footer>

</body>
</html>
